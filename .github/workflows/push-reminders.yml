name: Push reminders

# רץ כל רבע שעה, בדקות "מכוערות" (8/23/38/53) ולא עגולות. השעה בפועל
# לשליחה נקבעת בתוך הסקריפט לפי הגדרות האפליקציה (weighInReminderHour/
# workoutReminderHour) — כך ששינוי שעה הוא שינוי בהגדרות, לא עריכת
# הקובץ הזה. רוב ההרצות לא שולחות כלום, הן רק בודקות אם זו השעה הנכונה.
#
# נמדד בפועל (2026-09-29, דרך ה-API הציבורי של Actions): ריצות ב-':00'
# לא קרו כל שעה כפי שהוגדר — רק כ-5 פעמים ביום, לא 24, עם פערים של
# 3-9 שעות בין ריצה לריצה. זו לא איחור של כמה דקות, זו נפילה של רוב
# ההפעלות. גיטהאב עצמם מזהירים שדקה 0 של כל שעה היא נקודת העומס
# הגבוהה ביותר בעולם (כל ריפו שמריץ cron שעתי בוחר בדיוק אותה דקה),
# ושהאירוע עלול פשוט לא לקרות, לא רק להתעכב. דקות לא-עגולות אמורות
# לפגוע בפחות תור.
#
# workflow_dispatch מאפשר להריץ ידנית מהלשונית Actions בגיטהאב, ותמיד
# שולח הודעת בדיקה מיידית — שימושי לוודא שהצינור עובד בלי לחכות בכלל.
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

# הרשאות מינימליות: הג'וב הזה מריץ ספריות npm עם מפתח Firebase Admin ומפתח
# VAPID בסביבה - אין סיבה שיחזיק גם טוקן כתיבה לריפו
permissions:
  contents: read

# ריצה אחת בכל רגע: ריצה שנתקעה לא תיערם עם הבאות אחריה
concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ברירת המחדל היא 6 שעות
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # firebase-admin@14 דורש Node >=22 (עם 20 הספרייה לא נטענת)
      # גרסאות מוצמדות בכוונה, לא latest: בלי הצמדה, כל הרצה שעתית
      # מושכת ומריצה מיד כל גרסה חדשה שמתפרסמת ל-npm - עם הרשאות
      # Firebase Admin מלאות (קריאה/כתיבה לכל משתמש) ומפתח ה-VAPID,
      # בלי בדיקה אנושית. לעדכן ידנית כשרוצים גרסה חדשה, לא אוטומטית.
      - run: npm install firebase-admin@14.4.0 web-push@3.6.7
      - run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: BLA57QxQ4QDnk1fVsCw2cKpQhrB2ntI039LVIIFDHroKcYCJOIxuwB4VwND-Kaq5UPxCAV60utogpMd9P0jU3lI
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
