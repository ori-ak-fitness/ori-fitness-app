name: Push reminders

# רץ כל שעה עגולה. השעה בפועל לשליחה נקבעת בתוך הסקריפט לפי הגדרות
# האפליקציה (weighInReminderHour/workoutReminderHour) — כך ששינוי שעה
# הוא שינוי בהגדרות, לא עריכת הקובץ הזה. רוב ההרצות לא שולחות כלום,
# הן רק בודקות אם זו השעה הנכונה.
#
# workflow_dispatch מאפשר להריץ ידנית מהלשונית Actions בגיטהאב, ותמיד
# שולח הודעת בדיקה מיידית — שימושי לוודא שהצינור עובד בלי לחכות בכלל.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin web-push
      - run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: BLA57QxQ4QDnk1fVsCw2cKpQhrB2ntI039LVIIFDHroKcYCJOIxuwB4VwND-Kaq5UPxCAV60utogpMd9P0jU3lI
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
