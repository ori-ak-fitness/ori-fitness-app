name: Push reminders

# רץ פעם ביום ב-16:00 UTC — 18:00 בישראל בחורף, 19:00 בקיץ. שני
# הבדיקות (שקילה/אימון) רצות כאן בכל הרצה; כל אחת שולחת רק אם היא
# באמת רלוונטית היום (ראה scripts/send-reminders.mjs).
#
# workflow_dispatch מאפשר להריץ ידנית מהלשונית Actions בגיטהאב —
# שימושי לבדיקה בלי לחכות לשעה הקבועה.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin web-push
      - run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: BLA57QxQ4QDnk1fVsCw2cKpQhrB2ntI039LVIIFDHroKcYCJOIxuwB4VwND-Kaq5UPxCAV60utogpMd9P0jU3lI
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
