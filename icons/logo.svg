<!--
  לוגו אורי AK פיטנס — קרם ושחור, תואם לערכת הצבעים הבהירה של האפליקציה.
  מוצג ב-28 פיקסלים בסרגל העליון (שם רק הצורה נראית) וגם כבסיס
  לאייקוני ההתקנה (192/512/מסכה), שם גם "ORI AK FITNESS" קריא למטה.

  ה-AK בטורקיז בכוונה: זו האות הייחודית של המותג, וצבע נפרד גורם לה
  להיקרא כחלק מהשם ולא כרעש. אותו טורקיז של משתנה gold באפליקציה.

  להחלפה בלוגו שלך: פשוט דרוס את הקובץ הזה. מומלץ ריבועי.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="אורי AK פיטנס">
  <rect width="512" height="512" rx="102" fill="#f4efe4"/>
  <g fill="#2f2a22">
    <rect x="146" y="146" width="220" height="60"  rx="26"/>
    <rect x="76"  y="90"  width="72"  height="172" rx="30"/>
    <rect x="364" y="90"  width="72"  height="172" rx="30"/>
  </g>
  <text x="256" y="390" text-anchor="middle"
        font-family="'Monotype Corsiva', 'Segoe Script', cursive" font-size="48" font-weight="400"
        font-style="italic" letter-spacing="1">
    <tspan fill="#2f2a22">ORI </tspan><tspan fill="#1d6b6f">AK</tspan><tspan fill="#2f2a22"> FITNESS</tspan>
  </text>
</svg>
